[project]
name = "wb-sync"
version = "0.1.0"
description = "Выгрузка отчётов Wildberries, хранение в SQLite и генерация xlsx-реестров"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
wb-sync = "wb_sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
