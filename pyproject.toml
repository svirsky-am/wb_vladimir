[project]
name = "wb-sync"
version = "0.2.0"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "sqlalchemy>=2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24"]
sheets = ["gspread>=6.0", "google-auth>=2.28"]

[project.scripts]
wb-sync = "wb_sync.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wb_sync"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
